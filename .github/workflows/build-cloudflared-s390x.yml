name: Build cloudflared for s390x

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-cloudflared-s390x.yml"
      - "scripts/build-cloudflared-s390x.sh"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.x"
          check-latest: true
          cache: false

      - name: Build pinned upstream source
        run: bash scripts/build-cloudflared-s390x.sh dist

      - name: Inspect artifact
        run: |
          file dist/cloudflared-linux-s390x
          sha256sum --check dist/cloudflared-linux-s390x.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cloudflared-2026.8.2-linux-s390x
          path: |
            dist/cloudflared-linux-s390x
            dist/cloudflared-linux-s390x.sha256
          if-no-files-found: error
          retention-days: 14
