name: Test installer

on:
  workflow_dispatch:
  push:
    paths:
      - '*.sh'
      - 'templates/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/test-installer.yml'
  pull_request:
    paths:
      - '*.sh'
      - 'templates/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/test-installer.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check syntax
        run: |
          for script in install.sh bootstrap.sh scripts/*.sh tests/*.sh; do
            bash -n "$script"
          done
      - name: Run isolated regression tests
        run: bash tests/run.sh
      - name: Install nginx for loopback integration tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nginx
      - name: Verify actual nginx privacy and WebSocket behavior
        run: node tests/nginx-privacy.cjs
      - name: Verify real VMess authentication and bidirectional traffic
        run: node tests/vmess-loopback.cjs
